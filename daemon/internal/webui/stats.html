<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Global Stats - Quazaar Synker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #000; color: #fff; margin: 0; padding: 40px 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        a { color: #0a84ff; text-decoration: none; font-weight: 500; }
        
        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: #1c1c1e; padding: 24px; border-radius: 16px; display: flex; flex-direction: column; gap: 8px; }
        .stat-card .label { color: #888; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-card .value { font-size: 32px; font-weight: 700; color: #fff; }
        
        /* Now Playing Card */
        .now-playing { background: #1c1c1e; padding: 24px; border-radius: 16px; display: flex; align-items: center; gap: 24px; margin-bottom: 40px;}
        .now-playing img { width: 120px; height: 120px; border-radius: 12px; object-fit: cover; background: #2c2c2e; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
        .now-playing .info { display: flex; flex-direction: column; gap: 8px; }
        .now-playing .label { color: #fa243c; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .now-playing .title { font-size: 24px; font-weight: 700; margin: 0; }
        .now-playing .artist { font-size: 18px; color: #888; margin: 0; }
        .badge { background: #333; color: #fff; padding: 4px 10px; border-radius: 12px; font-size: 12px; width: fit-content; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 style="margin:0;">Global Statistics</h1>
            <a href="/">&larr; Back to Dashboard</a>
        </div>

        <div class="now-playing" id="npCard">
            <img id="npArt" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" alt="Artwork">
            <div class="info">
                <div class="label" id="npStatus">Last Played</div>
                <h2 class="title" id="npTitle">Loading...</h2>
                <p class="artist" id="npArtist">--</p>
                <div class="badge" id="npSource">--</div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="label">Total Listening Time</div>
                <div class="value" id="valTotalTime">-</div>
            </div>
            <div class="stat-card">
                <div class="label">Today's Time</div>
                <div class="value" id="valTodayTime">-</div>
            </div>
            <div class="stat-card">
                <div class="label">Today's Plays</div>
                <div class="value" id="valTodayPlays">-</div>
            </div>
            <div class="stat-card">
                <div class="label">Total Plays</div>
                <div class="value" id="valPlays">-</div>
            </div>
            <div class="stat-card">
                <div class="label">Unique Songs</div>
                <div class="value" id="valSongs">-</div>
            </div>
            <div class="stat-card">
                <div class="label">Synced Devices</div>
                <div class="value" id="valDevices">-</div>
            </div>
        </div>
    </div>

    <script>
        function formatDuration(sec) {
            if (!sec) return '0m';
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            if (h > 0) return `${h}h ${m}m`;
            return `${m}m`;
        }

        fetch('/api/v1/summary')
            .then(r => r.json())
            .then(data => {
                // Update Stats
                document.getElementById('valTotalTime').textContent = formatDuration(data.total_listening_time_sec);
                document.getElementById('valTodayTime').textContent = formatDuration(data.todays_total_listening_time_sec);
                document.getElementById('valTodayPlays').textContent = (data.todays_play_count || 0).toLocaleString();
                document.getElementById('valPlays').textContent = (data.total_play_count || 0).toLocaleString();
                document.getElementById('valSongs').textContent = (data.all_songs || 0).toLocaleString();
                document.getElementById('valDevices').textContent = data.device_numbers || 0;

                // Update Now Playing / Last Played
                const np = data.last_playing_song;
                if (np && np.title) {
                    document.getElementById('npTitle').textContent = np.title;
                    document.getElementById('npArtist').textContent = np.artist || (np.artists ? np.artists.join(', ') : 'Unknown Artist');
                    document.getElementById('npStatus').textContent = np.playback_status === 'Playing' ? '▶ Now Playing' : 'Last Played';
                    document.getElementById('npSource').textContent = np.device_name || np.source || 'Unknown Source';
                    
                    if (np.artwork_url) {
                        document.getElementById('npArt').src = np.artwork_url;
                    }
                } else {
                    document.getElementById('npTitle').textContent = 'No track recorded';
                }
            })
            .catch(err => {
                console.error(err);
                document.getElementById('npTitle').textContent = 'Error loading stats';
            });
    </script>
</body>
</html>
